# Integración continua de USASHOPP POS.
# - En cada push/PR: compila y corre TODAS las pruebas (dominio, aplicación, infraestructura con
#   SQLite real, y la prueba de humo que carga todas las pantallas WPF + la regla de tokens).
# - Al subir un tag vX.Y.Z: además publica la app self-contained, genera el instalador de Inno Setup
#   con esa versión y lo adjunta a un Release de GitHub. Ese .exe es el que se copia a la USB para
#   actualizar las cajas sin internet (Configuración → Este equipo → Actualizaciones).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versión (del tag o de Directory.Build.props)
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Restaurar
        run: dotnet restore Usashopp.Pos.sln

      - name: Compilar
        run: dotnet build Usashopp.Pos.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pruebas
        run: dotnet test Usashopp.Pos.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  instalador:
    if: github.ref_type == 'tag'
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar (self-contained win-x64)
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ needs.pruebas.outputs.version }}

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generar instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.pruebas.outputs.version }} installer/USASHOPP-POS.iss

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
